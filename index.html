<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Standby</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --text-primary: #F2F2F0;
    --text-secondary: #78787D;
    --accent-teal: #4CD9C0;
    --accent-amber: #FF9F45;
    --accent-violet: #B892FF;
    --dim: 1;
    --dim-sat: 1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Montserrat', -apple-system, system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  #stage {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    filter: brightness(var(--dim)) saturate(var(--dim-sat));
    transition: filter 1.4s ease;
    display: flex;
    flex-direction: row;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .half {
    flex: 1 1 50%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    min-width: 0;
  }

  /* ---------- CLOCK RING ---------- */
  #clockRing {
    width: min(48vw, 68vh);
    height: min(48vw, 68vh);
  }

  /* ---------- RIGHT SIDE ---------- */
  #right {
    justify-content: center;
    gap: 0;
  }

  .infoBlock {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 4vh 3vh;
    flex: 1;
    width: 100%;
  }

  #commuteBlock {
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  #commuteBlock:active { opacity: 0.55; }

  .blockLabel {
    font-size: clamp(13px, 1.8vw, 26px);
    color: var(--text-secondary);
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  .iconRow {
    display: flex;
    align-items: center;
    gap: 1.6vh;
  }

  .iconRow svg {
    width: clamp(40px, 7vw, 100px);
    height: clamp(40px, 7vw, 100px);
    flex-shrink: 0;
  }

  #wxTemp {
    font-size: clamp(44px, 8vw, 130px);
    font-weight: 300;
    color: var(--text-primary);
    line-height: 1;
  }

  #wxCond {
    font-size: clamp(16px, 2.4vw, 36px);
    color: var(--text-secondary);
    font-weight: 400;
  }

  #wxPrecip {
    display: none;
    align-items: center;
    gap: 5px;
    font-size: clamp(11px, 1.5vw, 22px);
    color: var(--accent-teal);
    font-weight: 500;
  }

  #wxPrecip svg { width: 1em; height: 1em; }

  #wxHiLo {
    font-size: clamp(14px, 2.1vw, 32px);
    color: var(--text-secondary);
    margin-top: 2px;
  }

  #wxHiLo span:first-child { color: var(--accent-amber); }

  #commuteTime {
    font-size: clamp(38px, 7vw, 110px);
    font-weight: 300;
    color: var(--text-primary);
    line-height: 1;
  }

  #commuteSub {
    font-size: clamp(13px, 2vw, 30px);
    color: var(--text-secondary);
  }

  #commuteSub .accent { color: var(--accent-violet); }

  .stale {
    opacity: 0.5;
    font-style: normal;
  }

  /* ---------- MODE TOGGLE ---------- */
  #modeToggle {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 14px);
    right: calc(env(safe-area-inset-right) + 16px);
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.28;
    z-index: 20;
  }
  #modeToggle svg { width: 18px; height: 18px; color: var(--text-secondary); }

  /* ---------- NIGHT OVERLAY / TAP TO WAKE ---------- */
  #wakeCatcher {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
  }
  body.dimmed #wakeCatcher { display: block; }

  #nightBadge {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 14px);
    left: 0;
    right: 0;
    text-align: center;
    font-size: 1.5vh;
    color: var(--text-secondary);
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
    z-index: 15;
  }
  body.dimmed #nightBadge { opacity: 0.35; }
</style>
</head>
<body>

<div id="stage">
  <div class="half" id="left">
    <svg id="clockRing" viewBox="0 0 150 150"></svg>
  </div>

  <div class="half" id="right">
    <div class="infoBlock" id="wxBlock">
      <div class="blockLabel">EDMONTON</div>
      <div class="iconRow">
        <svg id="wxIcon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" stroke="#FF9F45" stroke-width="1.5"/></svg>
        <div id="wxTemp">--°</div>
      </div>
      <div id="wxCond">Fetching weather…</div>
      <div id="wxPrecip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5c3 4 6 7.5 6 11a6 6 0 1 1-12 0c0-3.5 3-7 6-11z"/></svg>
        <span id="wxPrecipText">--</span>
      </div>
      <div id="wxHiLo"><span>--°</span> / --°</div>
    </div>

    <div class="infoBlock" id="commuteBlock">
      <div class="blockLabel">DRIVE TO WORK</div>
      <div class="iconRow">
        <svg viewBox="0 0 24 24" fill="none" stroke="#B892FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 17h14M6 17v-4l1.6-4.2A2 2 0 0 1 9.5 7.5h5a2 2 0 0 1 1.9 1.3L18 13v4M6 17a1.5 1.5 0 1 0 3 0 1.5 1.5 0 1 0-3 0M15 17a1.5 1.5 0 1 0 3 0 1.5 1.5 0 1 0-3 0"/>
        </svg>
        <div id="commuteTime">--</div>
      </div>
      <div id="commuteSub">Locating…</div>
    </div>
  </div>
</div>

<div id="modeToggle">
  <svg id="modeIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
</div>

<div id="nightBadge">tap to wake</div>
<div id="wakeCatcher"></div>

<script>
(function(){

  /* ================= CONFIG ================= */
  const HOME_ADDRESS = "203 Walker Rd NW, Edmonton, AB T5T 4C2, Canada";
  const WORK_ADDRESS = "Stadium Car Park, 116 Street 89 Ave NW, Edmonton, AB, Canada";
  // Get a free key at https://developer.tomtom.com/ (Routing API, no credit card needed)
  // and paste it below between the quotes.
  const TOMTOM_API_KEY = "YOUR_TOMTOM_API_KEY_HERE";
  // Fallback coords (central Edmonton) used only until geocoding succeeds
  let homeCoord = { lat: 53.5461, lon: -113.4938 };
  let workCoord = null;
  let weatherLat = homeCoord.lat, weatherLon = homeCoord.lon;

  function pad(n){ return n < 10 ? '0'+n : ''+n; }

  /* ================= CLOCK RING ================= */
  const ring = document.getElementById('clockRing');
  const cx = 75, cy = 75, rOuter = 68, rInner = 64;

  function tickClock(){
    const now = new Date();
    let h = now.getHours();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    const mm = pad(now.getMinutes());
    const ss = pad(now.getSeconds());
    const dateStr = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();
    const seconds = now.getSeconds();

    let html = '';
    for (let i = 0; i < 60; i++) {
      const angle = (i / 60) * 2 * Math.PI - Math.PI / 2;
      const x1 = cx + rInner * Math.cos(angle);
      const y1 = cy + rInner * Math.sin(angle);
      const x2 = cx + rOuter * Math.cos(angle);
      const y2 = cy + rOuter * Math.sin(angle);
      const lit = i < seconds;
      const color = lit ? '#4CD9C0' : '#2E2E31';
      const width = i % 5 === 0 ? 2 : 1;
      html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}"/>`;
    }
    html += `<text x="${cx}" y="${cy-20}" text-anchor="middle" font-size="8.5" font-weight="500" fill="#8E8E93" letter-spacing="0.03em">${dateStr}</text>`;
    html += `<text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="23" font-weight="600" fill="#F2F2F0">${h}:${mm}<tspan font-size="10.5" font-weight="500" fill="#4CD9C0">:${ss}</tspan></text>`;
    html += `<text x="${cx}" y="${cy+25}" text-anchor="middle" font-size="9" font-weight="500" fill="#FF9F45" letter-spacing="0.04em">${ampm}</text>`;
    ring.innerHTML = html;
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* ================= WEATHER ================= */
  const wxIcon = document.getElementById('wxIcon');
  const wxTemp = document.getElementById('wxTemp');
  const wxCond = document.getElementById('wxCond');
  const wxHiLo = document.getElementById('wxHiLo');
  const wxPrecip = document.getElementById('wxPrecip');
  const wxPrecipText = document.getElementById('wxPrecipText');

  const SNOW_CODES = [71,73,75,77,85,86];

  const WMO = {
    0:  ['Clear sky', sunIcon()],
    1:  ['Mainly clear', sunIcon()],
    2:  ['Partly cloudy', cloudIcon(true)],
    3:  ['Overcast', cloudIcon(false)],
    45: ['Fog', fogIcon()], 48: ['Fog', fogIcon()],
    51: ['Light drizzle', rainIcon()], 53: ['Drizzle', rainIcon()], 55: ['Dense drizzle', rainIcon()],
    56: ['Freezing drizzle', rainIcon()], 57: ['Freezing drizzle', rainIcon()],
    61: ['Light rain', rainIcon()], 63: ['Rain', rainIcon()], 65: ['Heavy rain', rainIcon()],
    66: ['Freezing rain', rainIcon()], 67: ['Freezing rain', rainIcon()],
    71: ['Light snow', snowIcon()], 73: ['Snow', snowIcon()], 75: ['Heavy snow', snowIcon()],
    77: ['Snow grains', snowIcon()],
    80: ['Rain showers', rainIcon()], 81: ['Rain showers', rainIcon()], 82: ['Violent showers', rainIcon()],
    85: ['Snow showers', snowIcon()], 86: ['Snow showers', snowIcon()],
    95: ['Thunderstorm', stormIcon()], 96: ['Thunderstorm', stormIcon()], 99: ['Thunderstorm', stormIcon()]
  };

  function sunIcon(){ return '<circle cx="12" cy="12" r="5" stroke="#FF9F45" stroke-width="1.5"/><g stroke="#FF9F45" stroke-width="1.5" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.2" y1="4.2" x2="6" y2="6"/><line x1="18" y1="18" x2="19.8" y2="19.8"/><line x1="19.8" y1="4.2" x2="18" y2="6"/><line x1="6" y1="18" x2="4.2" y2="19.8"/></g>'; }
  function cloudIcon(withSun){ return (withSun ? '<circle cx="8" cy="9" r="3.4" stroke="#FF9F45" stroke-width="1.5"/>' : '') + '<path d="M6.5 18a4 4 0 0 1-.6-7.96A5 5 0 0 1 15.2 8.2 4.2 4.2 0 0 1 17 16.3" stroke="#F2F2F0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M4.5 18h13" stroke="#F2F2F0" stroke-width="1.5" stroke-linecap="round"/>'; }
  function rainIcon(){ return cloudIcon(false) + '<g stroke="#4CD9C0" stroke-width="1.5" stroke-linecap="round"><line x1="8" y1="20" x2="7" y2="22.5"/><line x1="12" y1="20" x2="11" y2="22.5"/><line x1="16" y1="20" x2="15" y2="22.5"/></g>'; }
  function snowIcon(){ return cloudIcon(false) + '<g stroke="#BFE9FF" stroke-width="1.6" stroke-linecap="round"><line x1="8" y1="19.5" x2="8" y2="23"/><line x1="6.3" y1="21.2" x2="9.7" y2="21.2"/><line x1="16" y1="19.5" x2="16" y2="23"/><line x1="14.3" y1="21.2" x2="17.7" y2="21.2"/></g>'; }
  function fogIcon(){ return '<g stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="13" x2="21" y2="13"/><line x1="3" y1="17" x2="17" y2="17"/></g>'; }
  function stormIcon(){ return cloudIcon(false) + '<path d="M13 15l-3 4.5h2.6L11 23" stroke="#FF9F45" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>'; }

  async function fetchWeather(){
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${weatherLat}&longitude=${weatherLon}&current=temperature_2m,weather_code&hourly=precipitation_probability,precipitation,snowfall&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
      const res = await fetch(url);
      const data = await res.json();
      const temp = Math.round(data.current.temperature_2m);
      const code = data.current.weather_code;
      const hi = Math.round(data.daily.temperature_2m_max[0]);
      const lo = Math.round(data.daily.temperature_2m_min[0]);
      const info = WMO[code] || ['—', sunIcon()];
      wxTemp.textContent = temp + '°';
      wxCond.textContent = info[0];
      wxIcon.innerHTML = info[1];
      wxHiLo.innerHTML = '<span>' + hi + '°</span> / ' + lo + '°';
      wxCond.classList.remove('stale');

      const currentHour = data.current.time.slice(0, 13);
      const idx = data.hourly.time.findIndex(t => t.startsWith(currentHour));
      if (idx !== -1) {
        const prob = data.hourly.precipitation_probability[idx];
        const isSnow = SNOW_CODES.includes(code);
        const amount = isSnow ? data.hourly.snowfall[idx] : data.hourly.precipitation[idx];
        if (prob >= 20 && amount > 0) {
          const amountText = isSnow ? amount.toFixed(1) + 'cm' : amount.toFixed(1) + 'mm';
          wxPrecipText.textContent = prob + '% · ' + amountText;
          wxPrecip.style.display = 'flex';
        } else {
          wxPrecip.style.display = 'none';
        }
      }
    } catch (e) {
      wxCond.textContent = 'Weather unavailable';
      wxCond.classList.add('stale');
    }
  }

  /* ================= GEOCODING (once, cached) ================= */
  async function geocode(address){
    const cacheKey = 'geo:' + address;
    const cached = localStorage.getItem(cacheKey);
    if (cached) return JSON.parse(cached);
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(address);
    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const data = await res.json();
    if (!data || !data.length) throw new Error('no geocode result');
    const coord = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
    localStorage.setItem(cacheKey, JSON.stringify(coord));
    return coord;
  }

  async function initLocations(){
    try {
      homeCoord = await geocode(HOME_ADDRESS);
      weatherLat = homeCoord.lat; weatherLon = homeCoord.lon;
      fetchWeather();
    } catch(e) { /* keep fallback coords */ }
    try {
      workCoord = await geocode(WORK_ADDRESS);
      commuteSub.textContent = 'Tap for live traffic';
    } catch(e) {
      commuteSub.textContent = "Couldn't find that address";
    }
  }

  /* ================= COMMUTE (TomTom, live traffic, tap-to-check) ================= */
  const commuteTime = document.getElementById('commuteTime');
  const commuteSub = document.getElementById('commuteSub');
  const commuteBlock = document.getElementById('commuteBlock');
  let commuteLoading = false;

  async function fetchCommute(){
    if (!homeCoord || !workCoord || commuteLoading) return;
    if (!TOMTOM_API_KEY || TOMTOM_API_KEY === 'YOUR_TOMTOM_API_KEY_HERE') {
      commuteSub.textContent = 'Add a TomTom API key in the file to enable this';
      commuteSub.classList.add('stale');
      return;
    }
    commuteLoading = true;
    commuteTime.textContent = '···';
    commuteSub.textContent = 'Checking traffic…';
    commuteSub.classList.remove('stale');
    try {
      const url = `https://api.tomtom.com/routing/1/calculateRoute/${homeCoord.lat},${homeCoord.lon}:${workCoord.lat},${workCoord.lon}/json?key=${TOMTOM_API_KEY}&traffic=true&travelMode=car`;
      const res = await fetch(url);
      const data = await res.json();
      if (!data.routes || !data.routes.length) throw new Error('no route');
      const s = data.routes[0].summary;
      const mins = Math.round(s.travelTimeInSeconds / 60);
      const typicalMins = Math.round(s.noTrafficTravelTimeInSeconds / 60);
      const km = (s.lengthInMeters / 1000).toFixed(1);
      const delta = mins - typicalMins;
      const deltaText = delta >= 2 ? `+${delta} min vs typical` : delta <= -2 ? `${delta} min vs typical` : 'as usual';
      const now = new Date();
      commuteTime.textContent = mins + ' min';
      commuteSub.innerHTML = `<span class="accent">${km} km</span> · ${deltaText} · checked ${now.getHours()}:${pad(now.getMinutes())}`;
    } catch (e) {
      commuteTime.textContent = '--';
      commuteSub.textContent = 'Route unavailable — tap to retry';
      commuteSub.classList.add('stale');
    } finally {
      commuteLoading = false;
    }
  }

  commuteBlock.addEventListener('click', fetchCommute);

  initLocations();
  setInterval(fetchWeather, 15 * 60 * 1000);

  /* ================= NIGHT MODE ================= */
  // mode: 'auto' | 'day' | 'night'
  let mode = 'auto';
  let wakeTimer = null;
  const modeIcon = document.getElementById('modeIcon');
  const SUN = '<path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>';
  const MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>';

  function getSunTimes(date, lat, lon) {
    function toRad(d){return d*Math.PI/180;}
    function toDeg(r){return r*180/Math.PI;}
    const start = new Date(Date.UTC(date.getFullYear(),0,1));
    const N = Math.floor((date - start)/86400000) + 1;
    const zenith = 90.833;
    function calc(isRise){
      const lngHour = lon/15;
      const t = isRise ? N + ((6 - lngHour)/24) : N + ((18 - lngHour)/24);
      const M = (0.9856*t) - 3.289;
      let L = M + 1.916*Math.sin(toRad(M)) + 0.020*Math.sin(toRad(2*M)) + 282.634;
      L = (L+360)%360;
      let RA = toDeg(Math.atan(0.91764*Math.tan(toRad(L))));
      RA = (RA+360)%360;
      const Lq = Math.floor(L/90)*90, RAq = Math.floor(RA/90)*90;
      RA = (RA + (Lq - RAq)) / 15;
      const sinDec = 0.39782*Math.sin(toRad(L));
      const cosDec = Math.cos(Math.asin(sinDec));
      const cosH = (Math.cos(toRad(zenith)) - (sinDec*Math.sin(toRad(lat)))) / (cosDec*Math.cos(toRad(lat)));
      if (cosH > 1 || cosH < -1) return null;
      let H = isRise ? 360 - toDeg(Math.acos(cosH)) : toDeg(Math.acos(cosH));
      H /= 15;
      const T = H + RA - (0.06571*t) - 6.622;
      let UT = (T - lngHour + 24) % 24;
      return UT;
    }
    function utToDate(ut){
      if (ut === null) return null;
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      d.setUTCMilliseconds(ut*3600*1000);
      return d;
    }
    return { sunrise: utToDate(calc(true)), sunset: utToDate(calc(false)) };
  }

  function isNightNow(){
    const now = new Date();
    const { sunrise, sunset } = getSunTimes(now, homeCoord.lat, homeCoord.lon);
    if (!sunrise || !sunset) return false;
    return now < sunrise || now > sunset;
  }

  function applyDim(dimmed){
    document.documentElement.style.setProperty('--dim', dimmed ? '0.22' : '1');
    document.documentElement.style.setProperty('--dim-sat', dimmed ? '0.55' : '1');
    document.body.classList.toggle('dimmed', dimmed);
  }

  function evaluateMode(){
    if (mode === 'day') { applyDim(false); return; }
    if (mode === 'night') { applyDim(true); return; }
    applyDim(isNightNow());
  }

  let sensorActive = false;
  try {
    if ('AmbientLightSensor' in window) {
      const sensor = new window.AmbientLightSensor({ frequency: 0.2 });
      sensor.addEventListener('reading', () => {
        sensorActive = true;
        if (mode === 'auto') applyDim(sensor.illuminance < 8);
      });
      sensor.addEventListener('error', () => { sensorActive = false; });
      sensor.start();
    }
  } catch(e) { sensorActive = false; }

  setInterval(() => { if (mode === 'auto' && !sensorActive) evaluateMode(); }, 30000);
  evaluateMode();

  document.getElementById('modeToggle').addEventListener('click', (e) => {
    e.stopPropagation();
    mode = mode === 'auto' ? 'day' : mode === 'day' ? 'night' : 'auto';
    modeIcon.innerHTML = mode === 'night' ? MOON : mode === 'day' ? SUN : MOON;
    evaluateMode();
  });

  document.getElementById('wakeCatcher').addEventListener('click', () => {
    applyDim(false);
    clearTimeout(wakeTimer);
    wakeTimer = setTimeout(() => { if (mode !== 'day') evaluateMode(); }, 30000);
  });

})();
</script>
</body>
</html>
